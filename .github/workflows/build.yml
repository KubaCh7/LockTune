name: Build LockTune

on:
  push:
    branches: [main]
    # Version tags (v1.0, v1.1, …) publish a versioned release too.
    # (Path filters are not applied to tag pushes.)
    tags: ['v*']
    # Docs-only changes don't need a new build/release.
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a versioned release, e.g. 1.0 (leave empty for a normal build)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 26 image: Xcode 26 / Swift 6.2 SDK, needed for real Liquid Glass (glassEffect).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (universal, ad-hoc signed)
        run: |
          set -o pipefail
          # v1.2 tag → 1.2; normal pushes keep the current version number.
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          if [[ -n "$RELEASE_VERSION" ]]; then MARKETING_VERSION="$RELEASE_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          else MARKETING_VERSION="1.0"; fi
          echo "Version $MARKETING_VERSION (build ${{ github.run_number }})"
          xcodebuild \
            -project LockTune.xcodeproj \
            -scheme LockTune \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(isolated|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release/LockTune.app

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true

      - name: Install Spotify (so its AppleScript dictionary can be tested)
        run: |
          brew install --cask spotify || echo "Spotify install failed; its checks will be skipped"
          # Register it with Launch Services so the app can find it by bundle id.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Spotify.app || true

      - name: Self-test on this Mac
        run: |
          macOS_version=$(sw_vers -productVersion)
          echo "Runner macOS $macOS_version"
          perl -e 'alarm 180; exec @ARGV' \
            build/Build/Products/Release/LockTune.app/Contents/MacOS/LockTune --self-test

      - name: Package .dmg and .zip
        run: |
          APP=build/Build/Products/Release/LockTune.app
          codesign --force --deep --options runtime \
            --entitlements LockTune/Support/LockTune.entitlements --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "LockTune" -srcfolder dmg -ov -format UDZO LockTune.dmg
          ditto -c -k --keepParent "$APP" LockTune-app.zip
          # Read by the in-app updater.
          printf '{"build": %s, "commit": "%s"}\n' "${{ github.run_number }}" "${{ github.sha }}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: LockTune
          path: |
            LockTune.dmg
            LockTune-app.zip

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LockTune.dmg LockTune-app.zip version.json \
            --title "LockTune – build ${{ github.run_number }}" \
            --notes "Download **LockTune.dmg**, open it and drag LockTune into Applications. First launch: right-click → Open (or System Settings → Privacy & Security → Open Anyway), because the app isn't notarized. Built from ${{ github.sha }}."

      # Versioned release: from a v* tag push, or from "Run workflow" with
      # release_version set (GitHub creates the v<version> tag itself).
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            TAG="v${{ github.event.inputs.release_version }}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          VERSION="${TAG#v}"
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" LockTune.dmg LockTune-app.zip version.json \
            --target "$GITHUB_SHA" \
            --title "LockTune $VERSION" \
            --notes-file "$NOTES" \
            --latest
